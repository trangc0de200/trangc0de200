<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Văn Trang — Senior Full-Stack and Web3 Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16140f"/>
      <stop offset="0.55" stop-color="#221c16"/>
      <stop offset="1" stop-color="#2c241d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#d97757" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#b8826a"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#faf9f5" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="300" rx="26" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="300" rx="26" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="25" fill="none" stroke="#d97757" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- sunburst mark -->
  <g stroke="#d97757" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.55">
    <line x1="1040" y1="150" x2="1100" y2="150"/>
    <line x1="1040" y1="150" x2="1091.96" y2="180"/>
    <line x1="1040" y1="150" x2="1070" y2="201.96"/>
    <line x1="1040" y1="150" x2="1040" y2="210"/>
    <line x1="1040" y1="150" x2="1010" y2="201.96"/>
    <line x1="1040" y1="150" x2="988.04" y2="180"/>
    <line x1="1040" y1="150" x2="980" y2="150"/>
    <line x1="1040" y1="150" x2="988.04" y2="120"/>
    <line x1="1040" y1="150" x2="1010" y2="98.04"/>
    <line x1="1040" y1="150" x2="1040" y2="90"/>
    <line x1="1040" y1="150" x2="1070" y2="98.04"/>
    <line x1="1040" y1="150" x2="1091.96" y2="120"/>
  </g>
  <circle cx="1040" cy="150" r="95" fill="none" stroke="#d97757" stroke-opacity="0.16" stroke-width="1.5"/>
  <circle cx="1040" cy="150" r="14" fill="#d97757"/>
  <circle cx="1040" cy="150" r="26" fill="#d97757" fill-opacity="0.18"/>

  <!-- text -->
  <text x="72" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#faf9f5" letter-spacing="1">Văn Trang</text>
  <rect x="74" y="156" width="104" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="74" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#e6b59c" letter-spacing="0.5">Senior Full-Stack &amp; Web3 Developer</text>
  <text x="75" y="236" font-family="'Fira Code', 'Courier New', monospace" font-size="15" fill="#9a8d80" letter-spacing="1.5">Build clean  ·  Ship confidently  ·  Scale with purpose</text>
</svg>
